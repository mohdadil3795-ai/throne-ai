<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#07090f" />
<title>Throne AI — Battle, Code & 8K Studio</title>
<style>
  :root {
    --bg: #07090f;
    --glass: rgba(255, 255, 255, 0.055);
    --glass-strong: rgba(18, 22, 36, 0.82);
    --border: rgba(255, 255, 255, 0.11);
    --border-glow: rgba(124, 92, 255, 0.45);
    --text: #f3f6fc;
    --muted: #94a3b8;
    --accent: #7c5cff;
    --cyan: #00e5ff;
    --violet: #c084fc;
    --gold: #fbbf24;
    --green: #34d399;
    --red: #fb7185;
    --radius: 22px;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    height: 100dvh;
    width: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
  }

  /* Ambient Liquid Aura */
  body::before, body::after {
    content: "";
    position: fixed;
    width: 320px;
    height: 320px;
    border-radius: 50%;
    filter: blur(95px);
    z-index: 0;
    pointer-events: none;
    opacity: 0.28;
  }
  body::before { top: -80px; left: -60px; background: #7c5cff; }
  body::after { bottom: 60px; right: -80px; background: #00d2ff; }

  .app {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    height: 100dvh;
    max-width: 760px;
    margin: 0 auto;
  }

  /* Clean Flagship Header */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
    background: rgba(7, 9, 15, 0.72);
    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);
    border-bottom: 1px solid var(--border);
  }

  .brand-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .icon-btn {
    width: 38px;
    height: 38px;
    border-radius: 13px;
    border: 1px solid var(--border);
    background: var(--glass);
    color: var(--text);
    display: grid;
    place-items: center;
    font-size: 17px;
    cursor: pointer;
    transition: transform 0.15s ease, background 0.2s;
  }
  .icon-btn:active { transform: scale(0.93); }

  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 700;
    font-size: 18px;
    letter-spacing: -0.3px;
  }

  .logo-orb {
    width: 28px;
    height: 28px;
    border-radius: 10px;
    background: linear-gradient(135deg, #7c5cff, #00e5ff);
    display: grid;
    place-items: center;
    font-size: 15px;
    box-shadow: 0 0 18px rgba(124, 92, 255, 0.5);
  }

  .coin-pill {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 7px 13px;
    border-radius: 999px;
    background: linear-gradient(135deg, rgba(251, 191, 36, 0.16), rgba(124, 92, 255, 0.18));
    border: 1px solid rgba(251, 191, 36, 0.35);
    color: #fde68a;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }

  /* Chat Canvas */
  main {
    flex: 1;
    overflow-y: auto;
    padding: 16px 14px 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    scroll-behavior: smooth;
  }
  main::-webkit-scrollbar { width: 4px; }
  main::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 10px; }

  /* First 10-Second Hero Cards */
  .hero {
    margin: auto 0;
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding: 8px 2px;
  }

  .hero-title {
    text-align: center;
    margin-bottom: 4px;
  }
  .hero-title h1 {
    font-size: 24px;
    font-weight: 800;
    background: linear-gradient(135deg, #ffffff 20%, #a5b4fc 60%, #38bdf8 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: -0.5px;
  }
  .hero-title p {
    font-size: 13.5px;
    color: var(--muted);
    margin-top: 5px;
  }

  .starter-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 11px;
  }

  .starter-card {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 15px 16px;
    border-radius: var(--radius);
    background: var(--glass);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    text-align: left;
    color: var(--text);
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .starter-card:active {
    transform: scale(0.98);
    border-color: var(--border-glow);
    background: rgba(124, 92, 255, 0.12);
  }

  .starter-icon {
    width: 44px;
    height: 44px;
    border-radius: 15px;
    display: grid;
    place-items: center;
    font-size: 21px;
    flex-shrink: 0;
  }
  .ic-battle { background: rgba(0, 229, 255, 0.14); border: 1px solid rgba(0, 229, 255, 0.3); }
  .ic-code { background: rgba(124, 92, 255, 0.16); border: 1px solid rgba(124, 92, 255, 0.35); }
  .ic-art { background: rgba(251, 191, 36, 0.14); border: 1px solid rgba(251, 191, 36, 0.3); }

  .starter-card h3 { font-size: 15px; font-weight: 700; }
  .starter-card span { display: block; font-size: 12.5px; color: var(--muted); margin-top: 2px; }

  /* Messages */
  .msg {
    display: flex;
    flex-direction: column;
    max-width: 92%;
    animation: fadeUp 0.22s ease;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg.user {
    align-self: flex-end;
    background: linear-gradient(135deg, #6d4aff, #4f46e5);
    color: #fff;
    padding: 12px 16px;
    border-radius: 20px 20px 6px 20px;
    font-size: 15px;
    line-height: 1.48;
    box-shadow: 0 8px 24px rgba(109, 74, 255, 0.28);
  }

  .msg.ai {
    align-self: flex-start;
    width: 100%;
    max-width: 100%;
    background: var(--glass);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    padding: 14px 16px;
    border-radius: 22px 22px 22px 6px;
    font-size: 14.8px;
    line-height: 1.58;
  }

  .msg.ai p { margin-bottom: 9px; }
  .msg.ai p:last-child { margin-bottom: 0; }
  .msg.ai ul, .msg.ai ol { padding-left: 18px; margin: 6px 0 10px; }
  .msg.ai li { margin-bottom: 5px; }
  .msg.ai strong { color: #fff; }
  .msg.ai code.inline {
    background: rgba(255,255,255,0.1);
    padding: 2px 6px;
    border-radius: 6px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 13px;
    color: #7dd3fc;
  }

  /* Code Card + Live Sandbox Bar */
  .code-box {
    margin: 10px 0;
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid rgba(124, 92, 255, 0.35);
    background: #0b0f1a;
  }
  .code-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 6px;
    padding: 8px 11px;
    background: rgba(255,255,255,0.05);
    border-bottom: 1px solid var(--border);
  }
  .code-lang {
    font-size: 11.5px;
    font-weight: 700;
    text-transform: uppercase;
    color: var(--cyan);
    letter-spacing: 0.5px;
  }
  .code-actions {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .c-btn {
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.07);
    color: #fff;
    font-size: 11.5px;
    font-weight: 600;
    padding: 5px 9px;
    border-radius: 9px;
    cursor: pointer;
  }
  .c-btn.run {
    background: linear-gradient(135deg, #10b981, #059669);
    border-color: transparent;
  }
  .c-btn.fix {
    background: rgba(251, 191, 36, 0.16);
    border-color: rgba(251, 191, 36, 0.4);
    color: #fde68a;
  }
  .code-box pre {
    padding: 12px;
    overflow-x: auto;
    font-size: 12.5px;
    line-height: 1.45;
    color: #e2e8f0;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    max-height: 260px;
  }

  /* AI vs AI Split Debate Arena Card */
  .arena-wrap {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .arena-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11.5px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--cyan);
  }
  .arena-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  @media (max-width: 540px) {
    .arena-grid { grid-template-columns: 1fr; }
  }
  .fighter {
    padding: 13px;
    border-radius: 18px;
    background: rgba(10, 14, 26, 0.75);
    border: 1px solid var(--border);
  }
  .fighter.bolt { border-color: rgba(0, 229, 255, 0.35); }
  .fighter.nova { border-color: rgba(192, 132, 252, 0.38); }
  .fighter-head {
    font-size: 13px;
    font-weight: 800;
    margin-bottom: 7px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .fighter.bolt .fighter-head { color: var(--cyan); }
  .fighter.nova .fighter-head { color: var(--violet); }
  .fighter-body { font-size: 13.5px; line-height: 1.5; color: #e2e8f0; }

  .verdict-box {
    padding: 13px 14px;
    border-radius: 18px;
    background: linear-gradient(135deg, rgba(251, 191, 36, 0.14), rgba(124, 92, 255, 0.14));
    border: 1px solid rgba(251, 191, 36, 0.38);
  }
  .verdict-head {
    font-size: 12.5px;
    font-weight: 800;
    color: var(--gold);
    margin-bottom: 4px;
  }
  .share-battle-btn {
    margin-top: 8px;
    width: 100%;
    padding: 10px;
    border-radius: 13px;
    border: 1px solid rgba(255,255,255,0.16);
    background: rgba(255,255,255,0.08);
    color: #fff;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
  }

  /* 8K Image Card */
  .art-card {
    display: flex;
    flex-direction: column;
    gap: 9px;
  }
  .art-img-wrap {
    position: relative;
    border-radius: 18px;
    overflow: hidden;
    background: #0d1220;
    border: 1px solid var(--border);
    min-height: 220px;
    display: grid;
    place-items: center;
  }
  .art-img-wrap img {
    width: 100%;
    height: auto;
    display: block;
  }
  .art-prompt-tag {
    font-size: 12px;
    color: var(--muted);
    background: rgba(255,255,255,0.04);
    padding: 8px 11px;
    border-radius: 12px;
    border: 1px solid var(--border);
  }

  /* Thumb-Zone Controls */
  .dock {
    padding: 8px 12px calc(12px + env(safe-area-inset-bottom));
    background: rgba(7, 9, 15, 0.84);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border-top: 1px solid var(--border);
  }

  .mode-bar {
    display: flex;
    gap: 7px;
    overflow-x: auto;
    padding-bottom: 8px;
    scrollbar-width: none;
  }
  .mode-bar::-webkit-scrollbar { display: none; }

  .mode-chip {
    flex-shrink: 0;
    padding: 7px 13px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--glass);
    color: var(--muted);
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.18s;
  }
  .mode-chip.active {
    background: linear-gradient(135deg, rgba(124, 92, 255, 0.32), rgba(0, 229, 255, 0.22));
    border-color: rgba(124, 92, 255, 0.65);
    color: #fff;
  }

  /* Image Studio Sub-Chips */
  .studio-options {
    display: none;
    flex-direction: column;
    gap: 6px;
    padding: 8px 10px;
    margin-bottom: 8px;
    border-radius: 16px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
  }
  .studio-options.show { display: flex; }
  .chip-row {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .chip-row::-webkit-scrollbar { display: none; }
  .sub-chip {
    flex-shrink: 0;
    padding: 5px 10px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: rgba(0,0,0,0.28);
    color: var(--muted);
    font-size: 11.5px;
    font-weight: 600;
    cursor: pointer;
  }
  .sub-chip.active {
    border-color: var(--gold);
    color: #fde68a;
    background: rgba(251, 191, 36, 0.14);
  }

  .input-box {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    background: rgba(255, 255, 255, 0.065);
    border: 1px solid var(--border);
    border-radius: 22px;
    padding: 6px 8px 6px 14px;
  }
  .input-box:focus-within {
    border-color: var(--border-glow);
    box-shadow: 0 0 0 3px rgba(124, 92, 255, 0.14);
  }

  textarea {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-size: 16px;
    line-height: 1.4;
    max-height: 115px;
    resize: none;
    padding: 7px 0;
    font-family: inherit;
  }
  textarea::placeholder { color: #64748b; }

  .mic-btn, .send-btn {
    width: 40px;
    height: 40px;
    border-radius: 16px;
    border: none;
    display: grid;
    place-items: center;
    font-size: 17px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .mic-btn {
    background: rgba(255,255,255,0.07);
    color: var(--text);
  }
  .mic-btn.listening {
    background: rgba(251, 113, 133, 0.25);
    color: var(--red);
    animation: pulse 1s infinite;
  }
  @keyframes pulse { 50% { transform: scale(1.08); } }

  .send-btn {
    background: linear-gradient(135deg, #7c5cff, #38bdf8);
    color: #fff;
    font-weight: 700;
    box-shadow: 0 4px 16px rgba(124, 92, 255, 0.4);
  }
  .send-btn:disabled { opacity: 0.45; }

  /* Modals & Drawers */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(3, 5, 10, 0.78);
    backdrop-filter: blur(10px);
    z-index: 50;
    display: none;
    align-items: flex-end;
    justify-content: center;
  }
  .overlay.open { display: flex; }

  .sheet {
    width: 100%;
    max-width: 540px;
    background: #0e1322;
    border: 1px solid var(--border);
    border-radius: 26px 26px 0 0;
    padding: 20px 18px calc(22px + env(safe-area-inset-bottom));
    animation: slideUp 0.24s ease;
  }
  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }

  .sheet-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }
  .sheet-head h2 { font-size: 18px; font-weight: 800; }

  .plan-card {
    padding: 14px;
    border-radius: 18px;
    background: var(--glass);
    border: 1px solid var(--border);
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }
  .plan-card.pro {
    background: linear-gradient(135deg, rgba(124, 92, 255, 0.2), rgba(0, 229, 255, 0.14));
    border-color: rgba(124, 92, 255, 0.55);
  }
  .plan-btn {
    padding: 10px 14px;
    border-radius: 13px;
    border: none;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .plan-btn.free-ad { background: #fbbf24; color: #090d16; }
  .plan-btn.buy-pro { background: linear-gradient(135deg, #7c5cff, #38bdf8); color: #fff; }

  /* Fullscreen Live Sandbox Modal */
  .sandbox-modal {
    position: fixed;
    inset: 0;
    background: #05070d;
    z-index: 60;
    display: none;
    flex-direction: column;
  }
  .sandbox-modal.open { display: flex; }
  .sandbox-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: calc(10px + env(safe-area-inset-top)) 14px 10px;
    background: #0d1220;
    border-bottom: 1px solid var(--border);
  }
  .sandbox-frame {
    flex: 1;
    width: 100%;
    border: none;
    background: #fff;
  }

  /* History Drawer */
  .drawer {
    position: fixed;
    top: 0; left: 0; bottom: 0;
    width: 280px;
    background: #0c101d;
    border-right: 1px solid var(--border);
    z-index: 55;
    padding: calc(16px + env(safe-area-inset-top)) 14px 16px;
    display: none;
    flex-direction: column;
    gap: 12px;
  }
  .drawer.open { display: flex; }
  .hist-list {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 7px;
  }
  .hist-item {
    padding: 11px 12px;
    border-radius: 14px;
    background: var(--glass);
    border: 1px solid var(--border);
    font-size: 13px;
    color: #e2e8f0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    cursor: pointer;
  }

  /* Typing Dots */
  .typing { display: inline-flex; gap: 5px; padding: 6px 2px; }
  .typing span {
    width: 7px; height: 7px; border-radius: 50%; background: var(--cyan);
    animation: bounce 1.1s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce { 0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; } 40% { transform: scale(1); opacity: 1; } }

  .toast {
    position: fixed;
    top: 70px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(15, 23, 42, 0.95);
    border: 1px solid var(--border-glow);
    color: #fff;
    padding: 9px 16px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    z-index: 80;
    display: none;
  }
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="brand-wrap">
      <button class="icon-btn" onclick="toggleDrawer(true)" aria-label="Chats">☰</button>
      <div class="brand">
        <div class="logo-orb">👑</div>
        <span>Throne AI</span>
      </div>
    </div>
    <div style="display:flex;gap:8px;align-items:center;">
      <button class="coin-pill" onclick="openWallet()">🪙 <span id="coinCount">100</span></button>
      <button class="icon-btn" onclick="newChat()" title="New Chat">＋</button>
    </div>
  </header>

  <main id="chatBox"></main>

  <div class="dock">
    <div class="mode-bar" id="modeBar">
      <button class="mode-chip active" data-mode="chat" onclick="setMode('chat')">💬 Free Chat</button>
      <button class="mode-chip" data-mode="debate" onclick="setMode('debate')">⚔️ AI vs AI Fight</button>
      <button class="mode-chip" data-mode="code" onclick="setMode('code')">💻 Coding Pro</button>
      <button class="mode-chip" data-mode="image" onclick="setMode('image')">🎨 8K Studio</button>
    </div>

    <div class="studio-options" id="studioOptions">
      <div class="chip-row" id="styleChips">
        <button class="sub-chip active" data-val="Photorealistic 8K">📸 Realistic 8K</button>
        <button class="sub-chip" data-val="Pixar 3D Cartoon">🧸 3D Cartoon</button>
        <button class="sub-chip" data-val="Vibrant Anime">⚡ Anime</button>
        <button class="sub-chip" data-val="Neon Cyberpunk">🌃 Cyberpunk</button>
      </div>
      <div class="chip-row" id="ratioChips">
        <button class="sub-chip active" data-w="768" data-h="1344">📱 9:16 Reels</button>
        <button class="sub-chip" data-w="1024" data-h="1024">🟦 1:1 Insta</button>
        <button class="sub-chip" data-w="1344" data-h="768">🖥️ 16:9 YouTube</button>
      </div>
    </div>

    <div class="input-box">
      <textarea id="promptInput" rows="1" placeholder="Kuch bhi puchho (Hinglish / Hindi / English)..." oninput="autoGrow(this)"></textarea>
      <button class="mic-btn" id="micBtn" onclick="toggleVoice()" title="Voice Input">🎙️</button>
      <button class="send-btn" id="sendBtn" onclick="handleSend()">➤</button>
    </div>
  </div>
</div>

<!-- Coins & Micro-Pro Wallet Modal -->
<div class="overlay" id="walletModal" onclick="if(event.target===this)closeWallet()">
  <div class="sheet">
    <div class="sheet-head">
      <h2>🪙 Throne Coins & Pro Pass</h2>
      <button class="icon-btn" onclick="closeWallet()">✕</button>
    </div>
    <p style="font-size:13px;color:var(--muted);margin-bottom:14px;">
      Normal Chat & Study <b>100% Free</b> hai. AI vs AI Fight, Coding Pro aur 8K Studio ke liye coins ya Pro Pass use karein.
